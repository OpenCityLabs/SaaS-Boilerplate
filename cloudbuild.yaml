steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - 'MONGODB_URI=mongodb://placeholder:27017/placeholder'
      - --build-arg
      - MONGODB_DATABASE=placeholder
      - --build-arg
      - 'NEXT_PUBLIC_APP_URL=https://alignhealthcare.ai'
      - --build-arg
      - 'NEXT_PUBLIC_API_URL=https://api.alignhealthcare.ai'
      - -t
      - 'gcr.io/$PROJECT_ID/alignhealthcare:$BUILD_ID'
      - -t
      - 'gcr.io/$PROJECT_ID/alignhealthcare:latest'
      - .
    timeout: 1200s

  # Push the container image to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/$PROJECT_ID/alignhealthcare:$BUILD_ID'

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/$PROJECT_ID/alignhealthcare:latest'

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - alignhealthcare
      - --image
      - 'gcr.io/$PROJECT_ID/alignhealthcare:$BUILD_ID'
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - '2'
      - --min-instances
      - '0'
      - --max-instances
      - '10'
      - --timeout
      - '300'
      - --set-env-vars
      - 'NEXT_PUBLIC_APP_URL=https://alignhealthcare.ai,NEXT_PUBLIC_API_URL=https://api.alignhealthcare.ai,NODE_ENV=production,MONGODB_URI=mongodb://placeholder:27017/placeholder,MONGODB_DATABASE=placeholder'

images:
  - 'gcr.io/$PROJECT_ID/alignhealthcare:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/alignhealthcare:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
